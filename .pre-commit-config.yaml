repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0 # Оновлено до стабільної версії
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0 # Використовуйте актуальну версію ruff
    hooks:
      - id: ruff
        args: [ --fix ] # Автоматично виправляє помилки (як у вашому томі)
      - id: ruff-format # Замінює Black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
